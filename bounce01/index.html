<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Photo Switcher - Bounce 01</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Profile Photo Switcher</h1>

        <!-- Profile Photo Container -->
        <div class="avatar-container">
            <img 
                id="profile-img" 
                src="assets/professional.jpg" 
                alt="Osama Khader - Professional Photo" 
                class="avatar"
            >
        </div>

        <!-- Controls to switch image -->
        <div class="button-group">
            <button id="btn-pro" class="active">Professional</button>
            <button id="btn-casual">Casual</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
