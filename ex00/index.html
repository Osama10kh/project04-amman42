<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osama Khader | Portfolio</title>
    <!-- Google Fonts: Plus Jakarta Sans for crisp, modern legibility -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body data-theme="dark">

    <!-- Header Section -->
    <header class="header">
        <div class="header-container">
            
            <!-- Dynamic Hover Logo System -->
            <a href="#hero" class="logo-wrapper" aria-label="Osama Khader Home">
                <div class="logo-abbrev">O.K</div>
                <div class="logo-expanded">
                    <span class="first-name">Osama</span>
                    <span class="last-name">Khader</span>
                </div>
            </a>

            <!-- Centered Navigation Menu -->
            <nav class="nav-menu">
                <ul class="nav-list">
                    <li><a href="#about" class="nav-link">About</a></li>
                    <li><a href="#skills" class="nav-link">Skills</a></li>
                    <li><a href="#projects" class="nav-link">Projects</a></li>
                    <li><a href="#experience" class="nav-link">Experience</a></li>
                    <li><a href="#contact" class="nav-link">Contact</a></li>
                </ul>
            </nav>

            <!-- Theme Toggle Action Button -->
            <div class="header-actions">
                <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">
                    <span class="theme-icon">⚡</span>
                    <span class="theme-text">Theme</span>
                </button>
            </div>

        </div>
    </header>

</body>
</html>
